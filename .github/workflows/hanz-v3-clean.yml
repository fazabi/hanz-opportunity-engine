name: HANZ V3 Clean Integration
on:
  push:
    branches: [hanz-v3-clean-fix]

permissions:
  contents: write

jobs:
  integrate-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bring universal parser from staging branch
        run: |
          git fetch origin hanz-v3-universal-parser
          git show origin/hanz-v3-universal-parser:candidate-profile-v3.js > candidate-profile-v3.js

      - name: Patch production HTML non-destructively
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="candidate-profile-v3.js?v=3.0.1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('index.html has no </body> tag')
              s = s.replace('</body>', f'{tag}\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: JavaScript syntax check
        run: node --check candidate-profile-v3.js

      - name: Universal parser regression smoke test
        run: |
          node <<'NODE'
          global.window = global;
          global.document = {
            scripts: [],
            head: { appendChild(){} },
            createElement(){ return { addEventListener(){}, set src(v){this._src=v}, get src(){return this._src} }; },
            getElementById(){ return null; }
          };
          global.normalize = v => String(v ?? '').toLowerCase().replace(/[^a-z0-9+#./]+/g,' ').replace(/\s+/g,' ').trim();
          global.esc = v => String(v ?? '');
          global.analyzeCv = async () => ({ok:true,candidate_profile:{}});
          global.inferJobFamilies = (studies, skills) => {
            const h = global.normalize([...(studies||[]), ...(skills||[])].join(' '));
            const out=[];
            if(/network|tcp\/ip|gns3/.test(h)) out.push('Network / Infrastructure');
            if(/iot|arduino/.test(h)) out.push('IoT / Embedded Systems');
            return out;
          };
          global.scoreJob = () => ({score:0,reasons:[],eligible:false,hard_mismatch:false});
          global.renderAnalyzedProfile = () => {};
          global.candidateProfile = null;
          require('./candidate-profile-v3.js');
          const t = global.HANZProfileV3.selfTest();
          if(!t.ok){ console.error(t); process.exit(1); }
          if(!t.marketing.study_programs.includes('International Business Management')) process.exit(2);
          if(!t.technical.study_programs.includes('Teknologi Rekayasa Internet')) process.exit(3);
          console.log('Universal parser regression passed');
          NODE

      - name: Verify integration is minimal
        run: |
          grep -q 'candidate-profile-v3.js?v=3.0.1' index.html
          git diff --check
          git diff --stat

      - name: Commit tested integration to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html candidate-profile-v3.js
          if git diff --cached --quiet; then
            echo 'No integration changes needed.'
          else
            git commit -m 'Integrate universal candidate profile parser cleanly'
            git push origin HEAD:hanz-v3-clean-fix
          fi
