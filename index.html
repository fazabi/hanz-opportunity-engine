<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HANZ Opportunity Engine</title>
<style>html,body{margin:0;min-height:100%;background:#f5f7fb;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#526070;font-size:14px}</style>
</head>
<body><div class="boot">Loading HANZ Opportunity Engine…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./legacy-v2.5.html?v=20260917',{cache:'no-store'});
    if(!response.ok) throw new Error('Legacy frontend HTTP '+response.status);
    let html=await response.text();
    const injection='<script src="./candidate-profile-v3.js?v=3.0.0"><\\/script>';
    if(html.includes('<script src="candidate-profile-v3.js?v=3.0.1"></script>
</body>')) html=html.replace('</body>',injection+'</body>');
    else html+=injection;
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="boot">HANZ failed to load: '+String(error?.message||error)+'</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
