<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HANZ Opportunity Engine</title>
<style>html,body{margin:0;min-height:100%;background:#f5f7fb;font-family:Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#526070;font-size:14px}</style>
</head>
<body>
<div class="boot">Loading HANZ Opportunity Engine…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./legacy-v2.5.html?v=20260917c',{cache:'no-store'});
    if(!response.ok) throw new Error('Legacy frontend HTTP '+response.status);

    let html=await response.text();

    // Always load the universal parser after the legacy application script.
    // Remove older candidate-profile loaders first so it can never initialize twice.
    html=html.replace(/<script\b[^>]*src=["'][^"']*candidate-profile-v3\.js[^"']*["'][^>]*><\/script>/gi,'');

    // Split the closing tag so this loader's own <script> is never terminated early.
    const injection='<script src="./candidate-profile-v3.js?v=3.0.3"><'+'/script>';
    if(/<\/body>/i.test(html)){
      html=html.replace(/<\/body>/i,injection+'</body>');
    }else{
      html+=injection;
    }

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="boot">HANZ failed to load: '+String(error?.message||error)+'</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
